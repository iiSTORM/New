/* ============================================================
   STAT TYPES — the model can project kills, deaths, or assists.
   Each has a different natural "opponent adjustment" direction:
   a player's KILLS scale with the opponent's leakiness (their
   deaths/game); a player's DEATHS scale with the opponent's own
   kill power (their kills/game) — the opposite basis. ASSISTS
   follow kills' direction, since they come from the same team
   kill-events. Kill-participation is a meaningful multiplier for
   kills/assists (both are "kill events") but doesn't mean much
   for deaths, so it's skipped there.
   ============================================================ */

const STAT_TYPES = {
  kills: { key: "k", label: "Kills", oppBasis: "d", useKP: true },
  deaths: { key: "d", label: "Deaths", oppBasis: "k", useKP: false },
  assists: { key: "a", label: "Assists", oppBasis: "d", useKP: true },
};

/* ============================================================
   MODEL — all functions take `teams` explicitly since it can now
   come from a live fetch instead of the module-level fallback.
   ============================================================ */

function kpMultiplier(player, historyWeight, kpStrength) {
  const curKP = player.cur.kp;
  const histKP = player.hist ? player.hist.kp : curKP;
  const blendedKP = historyWeight * histKP + (1 - historyWeight) * curKP;
  const teamAvgKP = 66;
  const relative = blendedKP / teamAvgKP;
  return 1 + kpStrength * (relative - 1);
}

function opponentMultiplier(teams, opponentTeam, oppStrength, oppBasisKey) {
  const oppStat = teamStatPerGame(teams, opponentTeam, oppBasisKey);
  const ratio = oppStat / leagueAvgStat(teams, oppBasisKey);
  return 1 + oppStrength * (ratio - 1);
}

function getActualStat(match, team, playerName, statKey) {
  const raw = match.actual && match.actual[team] && match.actual[team][playerName];
  if (raw === undefined) return undefined;
  if (typeof raw === "number") return statKey === "k" ? raw : null; // legacy kills-only format
  return raw[statKey];
}

/* ============================================================
   RECENCY-WEIGHTED RATE — replaces a flat season average with an
   exponential decay by match recency, so a hot streak or a roster
   swap shows up faster than waiting for a whole season of games to
   dilute it. cutoffDate=null means "use every completed match in
   the split" (for live Future-tab projections); a real date means
   "only matches strictly before this one" (for point-in-time Past
   Results backtesting) — same function, same decay logic, either way.

   halfLife is in MATCHES (not individual games) since that's the
   granularity pastMatches stores — each entry is already a game-1
   + game-2 combined total, not two separate rows. A halfLife of 20+
   is treated as "off" (flat average) since decay is negligible over
   a realistic split length at that point.
   ============================================================ */

function recencyWeightedRate(pastMatches, team, playerName, statKey, cutoffDate, halfLife) {
  const entries = [];
  for (const m of pastMatches) {
    if (cutoffDate !== null && (!m.date || m.date >= cutoffDate)) continue;
    if (!m.actual || !(m.teamA === team || m.teamB === team) || !m.actual[team]) continue;
    const val = getActualStat(m, team, playerName, statKey);
    if (val === undefined || val === null) continue; // didn't play, or legacy data missing this stat
    entries.push({ date: m.date || "", val });
  }
  if (entries.length === 0) return { rate: null, games: 0 };
  entries.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)); // oldest first
  const n = entries.length;
  const flat = halfLife >= 20;
  let weightedSum = 0, weightedGames = 0;
  entries.forEach((e, idx) => {
    const matchesAgo = (n - 1) - idx; // 0 = most recent match
    const weight = flat ? 1 : Math.pow(0.5, matchesAgo / halfLife);
    weightedSum += e.val * weight;
    weightedGames += 2 * weight; // each match entry = game-1 + game-2 combined
  });
  return { rate: weightedGames > 0 ? weightedSum / weightedGames : null, games: n * 2 };
}

function project(teams, pastMatches, player, team, opponentTeam, games, weights, statType) {
  const cfg = STAT_TYPES[statType];
  const weighted = recencyWeightedRate(pastMatches, team, player.name, cfg.key, null, weights.recencyHalfLife);
  const curRate = weighted.rate !== null ? weighted.rate : player.cur[cfg.key]; // safety net if pastMatches is thin
  const base = player.hist ? weights.history * player.hist[cfg.key] + (1 - weights.history) * curRate : curRate;
  const oppMult = opponentMultiplier(teams, opponentTeam, weights.opponent, cfg.oppBasis);
  const kpMult = cfg.useKP ? kpMultiplier(player, weights.history, weights.kp) : 1;
  const perGame = base * oppMult * kpMult;
  return { base, oppMult, kpMult, perGame, total: perGame * games };
}

/* ============================================================
   POINT-IN-TIME MODEL — used only for Past Results, so the
   "projection" shown for a match reflects only data that existed
   before that match was played, not the final season averages.
   Derived entirely from pastMatches (which already has dated,
   per-player K/D/A for every completed match) — no extra
   scraping needed. Uses the same recencyWeightedRate() as the
   live model above, just with cutoffDate set to the match's own
   date instead of null.

   Known simplifications: kill-participation multiplier still uses
   full-season KP (per-match KP isn't captured in pastMatches), and
   the opponent-strength side (below) is a flat average rather than
   recency-weighted — base rate is the biggest lever and the one
   this feature targets; opponent-side recency would be a further
   refinement, not implemented here.
   ============================================================ */

function pointInTimeTeamStat(pastMatches, team, statKey, cutoffDate) {
  // "opponent's kills" and "opponent's deaths" are two different vantage
  // points on the same match: a team's deaths = the *other* team's kills
  // in that game, so statKey="d" sums the opponent's actual k values, and
  // statKey="k" sums the team's own actual k values.
  let total = 0, games = 0;
  for (const m of pastMatches) {
    if (!m.date || m.date >= cutoffDate) continue;
    const opp = m.teamA === team ? m.teamB : m.teamB === team ? m.teamA : null;
    if (!opp || !m.actual) continue;
    const sourceTeam = statKey === "d" ? opp : team;
    const sourceData = m.actual[sourceTeam];
    if (!sourceData) continue;
    for (const playerName in sourceData) {
      const val = getActualStat(m, sourceTeam, playerName, "k"); // team-level kills, either own or conceded
      if (typeof val === "number") total += val;
    }
    games += 2;
  }
  return games > 0 ? total / games : null;
}

function pointInTimeLeagueAvgStat(pastMatches, teams, statKey, cutoffDate) {
  const rates = Object.keys(teams)
    .map((t) => pointInTimeTeamStat(pastMatches, t, statKey, cutoffDate))
    .filter((r) => r !== null);
  if (rates.length === 0) return null;
  return rates.reduce((s, r) => s + r, 0) / rates.length;
}

function projectPointInTime(pastMatches, teams, player, team, opponentTeam, games, weights, cutoffDate, statType) {
  const cfg = STAT_TYPES[statType];
  const pt = recencyWeightedRate(pastMatches, team, player.name, cfg.key, cutoffDate, weights.recencyHalfLife);
  const histRate = player.hist ? player.hist[cfg.key] : null;

  // Base rate: blend point-in-time (recency-weighted) current-split rate
  // with prior-split rate, same weighting the live model uses. Early in a
  // split (no prior games yet) there's nothing to blend, so fall back to
  // prior-split alone, and only to the final-season number as a last
  // resort (true cold start, no data at all).
  let base;
  if (pt.rate !== null) {
    base = histRate !== null ? weights.history * histRate + (1 - weights.history) * pt.rate : pt.rate;
  } else {
    base = histRate !== null ? histRate : player.cur[cfg.key];
  }

  const oppStatPT = pointInTimeTeamStat(pastMatches, opponentTeam, cfg.oppBasis, cutoffDate);
  const leagueAvgPT = pointInTimeLeagueAvgStat(pastMatches, teams, cfg.oppBasis, cutoffDate);
  const oppStat = oppStatPT !== null ? oppStatPT : teamStatPerGame(teams, opponentTeam, cfg.oppBasis);
  const leagueAvg = leagueAvgPT !== null ? leagueAvgPT : leagueAvgStat(teams, cfg.oppBasis);
  const oppMult = 1 + weights.opponent * (oppStat / leagueAvg - 1);

  // KP multiplier is the one piece still using full-season data — see note above.
  const kpMult = cfg.useKP ? kpMultiplier(player, weights.history, weights.kp) : 1;

  const perGame = base * oppMult * kpMult;
  return { base, oppMult, kpMult, perGame, total: perGame * games, priorGames: pt.games };
}

/* ---------- Grouping helper ---------- */

function groupByLabel(items, labelFn) {
  const groups = [];
  const index = {};
  for (const item of items) {
    const label = labelFn(item) || "Other";
    if (!(label in index)) {
      index[label] = groups.length;
      groups.push([label, []]);
    }
    groups[index[label]][1].push(item);
  }
  return groups;
}

function WeekHeader({ label }) {
  return (
    <div style={{ fontSize: 11, letterSpacing: 2, color: "#5c6b7f", fontFamily: "'IBM Plex Mono', monospace", margin: "16px 0 8px", textTransform: "uppercase" }}>
      {label}
    </div>
  );
}

function FutureTab({ teams, pastMatches, upcomingMatches, weights, statType }) {
  const [customMode, setCustomMode] = useState(false);
  const teamNames = Object.keys(teams);
  const [customA, setCustomA] = useState(teamNames[0]);
  const [customB, setCustomB] = useState(teamNames[1]);

  // Sort by actual scheduled time (soonest first) before grouping — don't
  // rely on whatever order the source data happened to arrive in.
  const sorted = [...upcomingMatches].sort((a, b) => {
    const ta = a._sortKey || a.date || "";
    const tb = b._sortKey || b.date || "";
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });
  const grouped = groupByLabel(sorted, (m) => m.block || m.week || null);

  return (
    <div>
      <div style={{ fontSize: 11, color: "#4a5568", marginBottom: 12, lineHeight: 1.5 }}>
        Projected {STAT_TYPES[statType].label.toLowerCase()} (games 1+2 combined) for each
        upcoming matchup, using current model weights.
      </div>
      {upcomingMatches.length === 0 && (
        <div style={{ background: "#0f1420", border: "1px solid #1f2733", borderRadius: 10, padding: "16px", textAlign: "center", fontSize: 12, color: "#8b98a9", marginBottom: 10 }}>
          No upcoming matches loaded. Use the custom matchup tool below.
        </div>
      )}
      {grouped.map(([label, matches]) => (
        <div key={label}>
          <WeekHeader label={label} />
          {matches.map((m, i) => <FutureMatchCard key={i} teams={teams} pastMatches={pastMatches} match={m} weights={weights} statType={statType} />)}
        </div>
      ))}

      <button
        onClick={() => setCustomMode(!customMode)}
        style={{ width: "100%", marginTop: 8, padding: "10px", background: "#141b26", border: "1px solid #2a3441", borderRadius: 8, color: "#e8c15c", fontSize: 13, fontWeight: 600, cursor: "pointer" }}
      >
        {customMode ? "Hide custom matchup" : "Explore a custom matchup →"}
      </button>

      {customMode && (
        <div style={{ marginTop: 16 }}>
          <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
            {[[customA, setCustomA], [customB, setCustomB]].map(([val, setter], i) => (
              <select key={i} value={val} onChange={(e) => setter(e.target.value)} style={{ flex: 1, background: "#141b26", color: "#e8ecf1", border: `1px solid ${teams[val].color}55`, borderRadius: 8, padding: "10px 8px", fontSize: 14, fontWeight: 600 }}>
                {teamNames.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            ))}
          </div>
          <MatchupPanel teams={teams} pastMatches={pastMatches} teamA={customA} teamB={customB} games={2} weights={weights} statType={statType} />
        </div>
      )}
    </div>
  );
}

/* ---------- Past Results tab ---------- */

function PastMatchCard({ teams, pastMatches, match, weights, statType }) {
  const [open, setOpen] = useState(false);
  const cfg = STAT_TYPES[statType];
  const teamKeys = [match.teamA, match.teamB];

  const rows = teamKeys.flatMap((team) => {
    const opp = team === match.teamA ? match.teamB : match.teamA;
    return teams[team].players
      .map((p) => ({ p, actual: getActualStat(match, team, p.name, cfg.key) }))
      .filter(({ actual }) => actual !== undefined && actual !== null) // undefined = didn't play; null = legacy data without this stat
      .map(({ p, actual }) => {
        const r = projectPointInTime(pastMatches, teams, p, team, opp, 2, weights, match.date, statType);
        return { team, name: p.name, role: p.role, proj: r.total, priorGames: r.priorGames, actual, diff: actual - r.total };
      });
  });

  if (rows.length === 0) {
    // Legacy fallback data only ever tracked kills — nothing to show for
    // deaths/assists on those matches.
    return (
      <div style={{ background: "#0f1420", border: "1px solid #1f2733", borderRadius: 10, marginBottom: 10, padding: "12px 14px", fontSize: 12, color: "#4a5568" }}>
        {match.teamA} vs {match.teamB} — {cfg.label.toLowerCase()} data not available for this match.
      </div>
    );
  }

  const totalProj = rows.reduce((s, r) => s + r.proj, 0);
  const totalActual = rows.reduce((s, r) => s + r.actual, 0);
  const avgAbsDiff = rows.reduce((s, r) => s + Math.abs(r.diff), 0) / rows.length;
  // How many rows had zero prior current-split games to draw on (very early
  // in a split) — worth flagging since those projections lean entirely on
  // prior-split history rather than this season's form.
  const coldStartCount = rows.filter((r) => r.priorGames === 0).length;

  return (
    <div style={{ background: "#0f1420", border: "1px solid #1f2733", borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
      <div onClick={() => setOpen(!open)} style={{ cursor: "pointer", padding: "12px 14px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
            <span style={{ color: teams[match.teamA].color, fontWeight: 700 }}>{match.teamA}</span>
            <span style={{ color: "#4a5568", fontSize: 11 }}>vs</span>
            <span style={{ color: teams[match.teamB].color, fontWeight: 700 }}>{match.teamB}</span>
          </div>
          <span style={{ fontSize: 11, color: "#5c6b7f", fontFamily: "'IBM Plex Mono', monospace" }}>{match.date}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
          <span style={{ fontSize: 11, color: "#8b98a9" }}>
            <strong style={{ color: teams[match.winner].color }}>{match.winner}</strong> won {match.score} · model missed by avg <strong style={{ color: "#e8c15c" }}>{avgAbsDiff.toFixed(1)}</strong> {cfg.label.toLowerCase()}/player
            {coldStartCount > 0 ? ` · ${coldStartCount} on prior-split data only` : ""}
          </span>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5c6b7f" }}>{totalProj.toFixed(0)} proj / {totalActual} actual</span>
        </div>
      </div>
      {open && (
        <div style={{ borderTop: "1px solid #1f2733" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 44px 44px 44px", padding: "6px 14px", fontSize: 10, letterSpacing: 1, color: "#4a5568", fontFamily: "'IBM Plex Mono', monospace" }}>
            <span>PLAYER</span><span style={{ textAlign: "right" }}>PROJ</span><span style={{ textAlign: "right" }}>ACT</span><span style={{ textAlign: "right" }}>DIFF</span>
          </div>
          {rows.map((r) => (
            <div key={r.team + r.name} style={{ display: "grid", gridTemplateColumns: "1fr 44px 44px 44px", padding: "7px 14px", fontSize: 12, borderTop: "1px solid #161d28", alignItems: "center" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 5, height: 16, background: teams[r.team].color, borderRadius: 2 }} />
                {r.name}
                {r.priorGames === 0 && <span style={{ fontSize: 9, color: "#4a5568" }}>(no prior form)</span>}
              </span>
              <span style={{ textAlign: "right", color: "#8b98a9", fontFamily: "'IBM Plex Mono', monospace" }}>{r.proj.toFixed(1)}</span>
              <span style={{ textAlign: "right", color: "#e8ecf1", fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}>{r.actual}</span>
              <span style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", color: r.diff > 0 ? "#5fd97a" : r.diff < 0 ? "#e05f5f" : "#5c6b7f" }}>
                {r.diff > 0 ? "+" : ""}{r.diff.toFixed(1)}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

        <div key={label}>
          <WeekHeader label={label} />
          {matches.map((m, i) => <PastMatchCard key={i} teams={teams} pastMatches={pastMatches} match={m} weights={weights} statType={statType} />)}
        </div>
      ))}
    </div>
  );
}

/* ---------- Data status banner ---------- */

function DataStatus({ status, lastUpdated, errorDetail, onRetry }) {
  const color = status === "live" ? "#5fd97a" : status === "loading" ? "#8b98a9" : "#e0c341";
  const label =
    status === "live" ? `Live data · updated ${lastUpdated}` :
    status === "loading" ? "Loading live data…" :
    status === "no-url" ? "Using bundled snapshot (no live source configured)" :
    "Live fetch failed — using bundled snapshot";
  return (
    <div style={{ marginBottom: 16, padding: "8px 12px", background: "#0f1420", border: "1px solid #1f2733", borderRadius: 8 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: "#8b98a9" }}>
          <span style={{ width: 6, height: 6, borderRadius: "50%", background: color }} />
          {label}
        </div>
        {status !== "loading" && (
          <button onClick={onRetry} style={{ background: "none", border: "none", color: "#5c6b7f", fontSize: 11, cursor: "pointer", textDecoration: "underline" }}>
            refresh
          </button>
        )}
      </div>
      {status === "error" && errorDetail && (
        <div style={{ marginTop: 6, fontSize: 10, color: "#e05f5f", fontFamily: "'IBM Plex Mono', monospace", wordBreak: "break-word" }}>
          {errorDetail}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   ROOT
   ============================================================ */

function formatUpcoming(rawList) {
  // Normalizes either the live API's ISO timestamps or fallback {date,time}.
  // Keeps the original value as _sortKey so grouping/sorting isn't affected
  // by the display-formatted string.
  return rawList.map((m) => {
    if (m.date && m.date.includes("T")) {
      const d = new Date(m.date);
      return {
        ...m,
        _sortKey: m.date,
        date: d.toLocaleDateString(undefined, { month: "short", day: "numeric" }),
        time: d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }),
      };
    }
    return { ...m, _sortKey: m.date };
  });
}

function KillProjector() {
  const [region, setRegion] = useState("LCS");
  const [tab, setTab] = useState("future");
  const [statType, setStatType] = useState("kills");
  const [games, setGames] = useState(2);
  const [historyWeight, setHistoryWeight] = useState(DEFAULT_WEIGHTS.history);
  const [oppStrength, setOppStrength] = useState(DEFAULT_WEIGHTS.opponent);
  const [kpStrength, setKpStrength] = useState(DEFAULT_WEIGHTS.kp);
  const [recencyHalfLife, setRecencyHalfLife] = useState(DEFAULT_WEIGHTS.recencyHalfLife);
  const weights = { history: historyWeight, opponent: oppStrength, kp: kpStrength, recencyHalfLife };

  const [regionsData, setRegionsData] = useState(FALLBACK_REGIONS);
  const [status, setStatus] = useState(DATA_URL ? "loading" : "no-url");
  const [lastUpdated, setLastUpdated] = useState(null);
  const [errorDetail, setErrorDetail] = useState(null);

  const fetchLiveData = () => {
    if (!DATA_URL) {
      setStatus("no-url");
      return;
    }
    setStatus("loading");
    setErrorDetail(null);
    fetch(DATA_URL, { cache: "no-store" })
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return res.json();
      })
      .then((data) => {
        const fetchedRegions = data.regions || {};
        const anyTeams = Object.values(fetchedRegions).some(
          (r) => r.teams && Object.keys(r.teams).length > 0
        );
        if (!anyTeams) {
          throw new Error("Fetched data.json but every region had empty 'teams'");
        }
        // Merge per-region: a region missing or empty in the fetch keeps its
        // fallback rather than the whole app losing all regions over one
        // partial failure.
        setRegionsData((prev) => {
          const merged = { ...prev };
          for (const key of REGION_LIST) {
            const fetched = fetchedRegions[key];
            if (fetched && fetched.teams && Object.keys(fetched.teams).length > 0) {
              merged[key] = fetched;
            }
          }
          return merged;
        });
        setLastUpdated(data.generated_at ? new Date(data.generated_at).toLocaleString() : "just now");
        setStatus("live");
      })
      .catch((err) => {
        console.warn("Live data fetch failed, using bundled snapshot:", err);
        setErrorDetail(err && err.message ? err.message : String(err));
        setStatus("error");
      });
  };

  useEffect(() => {
    fetchLiveData();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const current = regionsData[region] || { teams: {}, past_matches: [], upcoming_matches: [] };
  const hasData = Object.keys(current.teams || {}).length > 0;
  const normalizedUpcoming = formatUpcoming(current.upcoming_matches || []);

  return (
    <div style={{ minHeight: "100vh", background: "#0a0e14", color: "#e8ecf1", fontFamily: "'Inter', -apple-system, sans-serif", padding: "24px 16px 60px" }}>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" />
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 11, letterSpacing: 3, color: "#e8c15c", fontFamily: "'IBM Plex Mono', monospace" }}>LOL ESPORTS — KILL PROJECTOR</div>
          <div style={{ fontSize: 22, fontWeight: 800, marginTop: 4 }}>Weighted kill projections</div>
          <div style={{ fontSize: 13, color: "#8b98a9", marginTop: 2 }}>Blends this split's rates with prior-split history, opponent strength, and kill-participation.</div>
        </div>

        <DataStatus status={status} lastUpdated={lastUpdated} errorDetail={errorDetail} onRetry={fetchLiveData} />

        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
          {REGION_LIST.map((key) => (
            <button
              key={key}
              onClick={() => setRegion(key)}
              style={{
                flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid " + (region === key ? "#4fa8e0" : "#1f2733"),
                background: region === key ? "#4fa8e018" : "#0f1420", color: region === key ? "#4fa8e0" : "#8b98a9",
                fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}
            >
              {REGION_LABELS[key]}
            </button>
          ))}
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          {[["future", "Future"], ["past", "Past Results"]].map(([id, label]) => (
            <button
              key={id}
              onClick={() => setTab(id)}
              style={{
                flex: 1, padding: "10px 0", borderRadius: 8, border: "1px solid " + (tab === id ? "#e8c15c" : "#1f2733"),
                background: tab === id ? "#e8c15c18" : "#0f1420", color: tab === id ? "#e8c15c" : "#8b98a9",
                fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}
            >
              {label}
            </button>
          ))}
        </div>

        <StatTypeSelector statType={statType} setStatType={setStatType} />

        <WeightControls
          games={games} setGames={setGames}
          historyWeight={historyWeight} setHistoryWeight={setHistoryWeight}
          oppStrength={oppStrength} setOppStrength={setOppStrength}
          kpStrength={kpStrength} setKpStrength={setKpStrength}
          recencyHalfLife={recencyHalfLife} setRecencyHalfLife={setRecencyHalfLife}
        />

        {!hasData ? (
          <div style={{ background: "#0f1420", border: "1px solid #1f2733", borderRadius: 10, padding: "20px 16px", textAlign: "center" }}>
            <div style={{ fontSize: 13, color: "#8b98a9" }}>No {REGION_LABELS[region]} data available yet.</div>
            <div style={{ fontSize: 12, color: "#4a5568", marginTop: 4 }}>
              {status === "live" || status === "loading"
                ? "This region may not have loaded from the live source — try refresh above."
                : "The live source hasn't loaded, and there's no offline snapshot for this region yet."}
            </div>
          </div>
        ) : tab === "future" ? (
          <FutureTab teams={current.teams} pastMatches={current.past_matches || []} upcomingMatches={normalizedUpcoming} weights={weights} statType={statType} />
        ) : (
          <PastResultsTab teams={current.teams} pastMatches={current.past_matches || []} weights={weights} statType={statType} />
        )}

        <div style={{ marginTop: 20, fontSize: 11, color: "#4a5568", lineHeight: 1.6 }}>
          Tap any match card to expand player-level detail.
          Data: regular-season box scores (gol.gg) and schedule (LoL Esports API).
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<KillProjector />);

} catch (err) {
  document.getElementById('root').innerHTML =
    '<div id="error-box">Render error: ' + err.message + '\n\n' + (err.stack || '') + '</div>';
}
</script>
</body>
</html>
