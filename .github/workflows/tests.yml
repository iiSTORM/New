name: Tests

# Runs on pull requests and on pushes to main. The scrape workflow's own
# bot commits land on main, so this doubles as a check that each freshly
# scraped snapshot still has the shape index.html expects.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scrapers' dependencies are installed because the guards under
      # test live in modules that import them at module level:
      # scrape_career.py (requests, beautifulsoup4) for its cache-collapse
      # guard, scrape_cs2.py (aiohttp, cs2api) for the upcoming-match
      # window. Without them those tests would skip rather than run, which
      # is worse than not having written them. Nothing here touches the
      # network.
      - name: Install test dependencies
        run: pip install pytest requests beautifulsoup4 aiohttp cs2api

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check every script still compiles
        # Cheap guard for the scrapers themselves, which are not unit-tested
        # because they are network-bound end to end.
        run: python -m compileall -q scripts/

      # ---- Front end -----------------------------------------------------
      # index.html is generated from src/app.jsx. Committing a stale
      # index.html would ship an app that does not match its source and is
      # invisible in review, since the diff would simply be missing. This
      # rebuilds and fails if the result differs from what is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Check index.html matches src/
        run: npm run check

      # Which posted line gets compared with which projection is the one
      # piece of money-relevant logic that lives in the frontend, so it is
      # tested rather than left to review. Needs no packages -- it reads
      # the function out of src/app.jsx and runs it.
      - name: Check prop selection
        run: node tests/prop_selection.test.mjs

      # The one piece of arithmetic here that becomes a number someone stakes
      # money on, and it is not a product of probabilities: two legs on one
      # match land the same way 55.2% of the time against 50.0% across
      # matches, so within a match they share a factor. A five-leg same-match
      # parlay comes out at 0.112 where multiplying says 0.078.
      - name: Check the parlay engine and its Python port agree
        run: node tests/parlay_parity.test.mjs

      # The board-fixture inference runs twice, in two languages: in the
      # scrape workflow so the fixtures are committed and auditable, and at
      # read time so a line posted since the last scrape is visible while it
      # is live. Drift between them is silent and lands on the money side --
      # the app listing a fixture the data file does not have, or hiding one
      # it does, with the projection beside a line on the wrong game.
      - name: Check both board-fixture ports agree
        run: node tests/board_parity.test.mjs

      # The whole measurement apparatus here rests on optimize_weights.py
      # being a faithful port of the model in src/app.jsx. Nothing enforced
      # that, and they had drifted in two places at once -- a constant left
      # at its pre-measurement value in one copy, and elapsed days floored
      # on one side and fractional on the other. While they disagree, every
      # weight "measured" in Python describes a model nobody runs.
      - name: Check the JS model and its Python port agree
        run: node tests/model_parity.test.mjs

      # The team-share tier: mechanics underneath a weight that was chosen
      # by measurement. A tier that silently fails to compute does not
      # throw -- it quietly returns the old number and the measured gain
      # disappears with nothing going red.
      - name: Check the model tiers
        run: node tests/model_tiers.test.mjs

      # Mounts the real components against deliberately awkward data. Every
      # other frontend test here checks pure functions, which leaves the
      # worst failure class uncovered: a throw inside JSX unmounts the whole
      # tree, so the page goes blank rather than one number going missing.
      # A real crash shipped that way -- a card printing a team name the
      # scraper had never seen -- with the pure suite fully green.
      - name: Check the page still renders
        run: node tests/render_smoke.test.mjs
