name: Update esports data

on:
  schedule:
    # Runs at 09:00 and 21:00 UTC daily. Adjust to taste — games are usually
    # done by ~03:00 UTC, so a morning run after a game day catches
    # everything. GitHub may delay scheduled runs by a few minutes.
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  # LoL and Valorant scraping run as separate jobs (separate runners) so
  # they execute in parallel instead of one waiting on the other — they
  # write to different files (data.json vs valorant_data.json) so there's
  # no real dependency between them. This alone roughly halves total wall
  # time versus running both as sequential steps in one job.
  scrape-lol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape gol.gg (LoL player stats + past match results)
        run: python scripts/scrape_lcs.py

      - name: Scrape LoL schedule (LoL Esports API)
        run: python scripts/scrape_schedule.py
        continue-on-error: true  # don't block the whole update if this one API hiccups

      - name: Scrape LoL player career history (gol.gg, multi-season)
        run: python scripts/scrape_career.py
        continue-on-error: true  # incremental/cached by design, but shouldn't block data.json if it fails or times out — a stale career_data.json (or none at all) just means merge_career_data() falls back every player to career=None, which the model already handles gracefully
        timeout-minutes: 45  # first-ever run has no cache to build on (hundreds of players, some needing all 11 seasons individually) — subsequent runs are much faster since past seasons are cached and only the current season gets re-fetched

      - name: Aggregate champion-level stat baselines
        run: python scripts/aggregate_champion_stats.py
        continue-on-error: true  # reads data.json's per_game field (from scrape_lcs.py above) — champion_stats.json is fetched independently by the app, so a failure here doesn't affect anything else in this job

      - name: Merge LoL data into final data.json
        run: python scripts/merge.py

      - name: Commit data.json
        run: |
          git config user.name "esports-data-bot"
          git config user.email "actions@github.com"
          git add data.json
          # career_data.json and champion_stats.json are produced by
          # continue-on-error steps above — they might not exist on a
          # run where those steps failed, or partway through the very
          # first-ever career scrape. Add them only if present, same
          # pattern already used for valorant_data.json below.
          [ -f career_data.json ] && git add career_data.json
          [ -f champion_stats.json ] && git add champion_stats.json
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update LoL data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # All three files are wholesale-regenerated every run (nothing
          # here is incrementally edited at the git level, even though
          # scrape_career.py's OWN internal caching is incremental) — a
          # real merge-conflict was found committed to data.json after
          # two overlapping runs both pushed near-total rewrites, the
          # same failure mode already fixed for cs2_data.json below.
          # Since these files are idempotently regenerated, a content-
          # level merge is never actually meaningful here — on push
          # rejection, this discards the local commit's position
          # entirely, resets to the latest remote state, and re-applies
          # this run's already-generated files fresh on top, so
          # "whoever pushes last simply wins with their snapshot" rather
          # than attempting a merge that was never going to succeed
          # cleanly for a full-file rewrite.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected ($i/5) — resetting to latest remote and reapplying this run's snapshot..."
            cp data.json /tmp/data.json.new
            [ -f career_data.json ] && cp career_data.json /tmp/career_data.json.new
            [ -f champion_stats.json ] && cp champion_stats.json /tmp/champion_stats.json.new
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data.json.new data.json
            git add data.json
            if [ -f /tmp/career_data.json.new ]; then
              cp /tmp/career_data.json.new career_data.json
              git add career_data.json
            fi
            if [ -f /tmp/champion_stats.json.new ]; then
              cp /tmp/champion_stats.json.new champion_stats.json
              git add champion_stats.json
            fi
            if git diff --quiet --cached; then
              echo "Remote already has this exact snapshot — nothing left to push"
              exit 0
            fi
            git commit -m "Update LoL data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep $((RANDOM % 5 + 1))
          done
          git push

  scrape-valorant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape VLR.gg (Valorant match stats + results)
        run: python scripts/scrape_valorant.py
        continue-on-error: true  # experimental — don't let a failure here block the LoL data getting committed

      - name: Commit valorant_data.json
        run: |
          git config user.name "esports-data-bot"
          git config user.email "actions@github.com"
          if [ ! -f valorant_data.json ]; then
            echo "valorant_data.json wasn't produced this run, nothing to commit"
            exit 0
          fi
          git add valorant_data.json
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Valorant data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Same reasoning as data.json/cs2_data.json below — this file is
          # wholesale-regenerated every run, not incrementally edited, so
          # reset-and-reapply on push rejection is correct; a content-
          # level git merge was never going to be meaningful for a full-
          # file rewrite in the first place.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected ($i/5) — resetting to latest remote and reapplying this run's snapshot..."
            cp valorant_data.json /tmp/valorant_data.json.new
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/valorant_data.json.new valorant_data.json
            git add valorant_data.json
            if git diff --quiet --cached; then
              echo "Remote already has this exact snapshot — nothing left to push"
              exit 0
            fi
            git commit -m "Update Valorant data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep $((RANDOM % 5 + 1))
          done
          git push

  scrape-cs2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cs2api aiohttp

      - name: Scrape bo3.gg (CS2 per-map player stats via direct API + cs2api discovery)
        # New/experimental — MATCH_LIMIT is currently capped at 20 in
        # scrape_cs2.py (a deliberate validation-mode limit, not yet raised
        # for full production coverage). continue-on-error so a hiccup here
        # never blocks LoL/Valorant data from committing.
        run: python scripts/scrape_cs2.py
        continue-on-error: true

      - name: Commit cs2_data.json
        run: |
          git config user.name "esports-data-bot"
          git config user.email "actions@github.com"
          if [ ! -f cs2_data.json ]; then
            echo "cs2_data.json wasn't produced this run, nothing to commit"
            exit 0
          fi
          git add cs2_data.json
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update CS2 data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # cs2_data.json is wholesale-regenerated every run, not
          # incrementally edited — a real conflict-marker was found
          # committed to this file after two overlapping runs both tried
          # to push near-total rewrites of it, which is close to the
          # worst case for git's line-level rebase/merge. Since the file
          # is idempotently regenerated (not hand-edited), a content-level
          # merge is never actually meaningful here — on push rejection,
          # this discards the local commit's position entirely, resets to
          # the latest remote state, and re-applies the SAME already-
          # generated file fresh on top, so "whoever pushes last simply
          # wins with their snapshot" rather than attempting a merge that
          # was never going to succeed cleanly for a full-file rewrite.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected ($i/5) — resetting to latest remote and reapplying this run's snapshot..."
            cp cs2_data.json /tmp/cs2_data.json.new
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cs2_data.json.new cs2_data.json
            git add cs2_data.json
            if git diff --quiet --cached; then
              echo "Remote already has this exact snapshot — nothing left to push"
              exit 0
            fi
            git commit -m "Update CS2 data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep $((RANDOM % 5 + 1))
          done
          git push