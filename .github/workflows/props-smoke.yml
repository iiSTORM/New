name: Prop provider smoke check

# Does the provider still return what the parser expects?
#
# The props fetch cannot be exercised from every development environment —
# the provider is frequently unreachable behind corporate or sandboxed
# network policies — so this runs the real request on a GitHub runner and
# prints the funnel: how many props came back, how many matched, and the
# reason for every one that did not.
#
# Scoped to pull requests that touch the props code, so it does not hit
# someone else's server on unrelated changes, and informational rather than
# blocking: this is a check on an external service's shape, and a bad
# afternoon at the provider is not a reason to block a merge.
on:
  pull_request:
    paths:
      - "scripts/scrape_props.py"
      - "scripts/props_match.py"
      - ".github/workflows/props-smoke.yml"
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # The parser and matcher, proven against a saved payload shaped like
      # the real response. This one is NOT continue-on-error: it needs no
      # network, so a failure here is this PR's code, not someone's server.
      - name: Parse a saved payload (no network)
        run: |
          python scripts/scrape_props.py \
            --fixture tests/fixtures/prizepicks_projections.json --dry-run

      - name: Fetch live props (dry run — writes nothing)
        continue-on-error: true
        run: python scripts/scrape_props.py --dry-run

      - name: What this proves
        if: always()
        run: |
          echo "EXPECT THE LIVE STEP TO FAIL WITH HTTP 403 while PrizePicks"
          echo "  is the configured provider. A runner is a datacenter, and"
          echo "  that is what its bot protection does. It is informational"
          echo "  so the 403 does not block the merge -- a green job here is"
          echo "  NOT evidence that the live fetch worked. Read its output."
          echo
          echo "The step above it is the one that proves something: it runs"
          echo "  the same parser and matcher over a saved payload, so a"
          echo "  shape change in this PR's code fails it with no network."
          echo
          echo "Once a server-fetchable provider is configured, the live step"
          echo "  becomes readable: a healthy run shows raw props > 0 and"
          echo "  most of them matched. raw = 0 means the response shape"
          echo "  changed or nothing is posted; raw > 0 with 0 matched means"
          echo "  matching is failing, and the per-reason counts name which."
